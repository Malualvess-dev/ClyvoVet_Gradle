<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClyvoVet - Tutores</title>

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="sidebar">

    <div class="logo">
        ClyvoVet
    </div>

    <nav>

        <a href="/web/dashboard">
            Início
        </a>

        <a href="/web/agenda">
            Agenda
        </a>

        <a href="/web/tutores"
           id="menuTutores"
           class="active">
            Tutores
        </a>

        <a href="/web/veterinarios"
           id="menuVeterinarios">
            Veterinários
        </a>

        <a href="/web/anexos">
            Anexos
        </a>

        <a href="/web/notificacoes">
            Notificações
        </a>

    </nav>

    <button
            id="logoutButton"
            class="logout">
        Sair
    </button>

</div>

<main class="content">

    <header>

        <div>
            <h1>Tutores</h1>
            <p>Gerencie os tutores cadastrados.</p>
        </div>

        <div class="profile">
            <span id="tipoUsuario">
                Usuário
            </span>
        </div>

    </header>

    <section class="cards">

        <div class="card">
            <h3>Novo tutor</h3>
            <p>
                Cadastre um novo tutor no sistema.
            </p>
        </div>

        <div class="card">
            <h3>Consultar tutores</h3>
            <p>
                Visualize os tutores cadastrados.
            </p>
        </div>

    </section>

</main>

<script th:src="@{/js/dashboard.js}"></script>

</body>
</html>
