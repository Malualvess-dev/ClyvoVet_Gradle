<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="historico-clinico" class="cartao">
    <h2>Histórico clínico</h2>
    <p class="vazio" th:if="${historico.isEmpty()}">Nenhum atendimento concluído até o momento.</p>
    <ul class="lista">
        <li th:each="atendimento : ${historico}" class="item item-bloco">
            <div class="item-titulo"
                 th:text="${#temporals.format(atendimento.dataHora, 'dd/MM/yyyy')} + ' · ' + ${atendimento.motivo}">Atendimento</div>
            <div class="item-detalhe"
                 th:text="${atendimento.veterinarioNome} + ' · Peso aferido: ' + ${atendimento.pesoAferidoKg} + ' kg'">Veterinário</div>
            <div class="prontuario">
                <p><strong>Diagnóstico:</strong> <span th:text="${atendimento.diagnostico}">Diagnóstico</span></p>
                <p th:if="${atendimento.prescricao}"><strong>Prescrição:</strong> <span th:text="${atendimento.prescricao}">Prescrição</span></p>
            </div>
        </li>
    </ul>
</section>

<section th:fragment="carteira-de-vacinacao" class="cartao">
    <h2>Carteira de vacinação</h2>
    <p class="vazio" th:if="${vacinas.isEmpty()}">Nenhuma vacina registrada.</p>
    <table class="tabela" th:unless="${vacinas.isEmpty()}">
        <thead>
        <tr>
            <th>Vacina</th>
            <th>Aplicação</th>
            <th>Próxima dose</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="vacina : ${vacinas}">
            <td th:text="${vacina.nome}">Vacina</td>
            <td th:text="${#temporals.format(vacina.dataAplicacao, 'dd/MM/yyyy')}">Data</td>
            <td th:text="${vacina.proximaDose} ? ${#temporals.format(vacina.proximaDose, 'dd/MM/yyyy')} : '—'">Data</td>
        </tr>
        </tbody>
    </table>
</section>

</body>
</html>
