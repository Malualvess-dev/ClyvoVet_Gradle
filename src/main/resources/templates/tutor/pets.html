<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meus pets')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('pets')}"></aside>

    <main class="conteudo">
        <header class="cabecalho">
            <div>
                <h1>Meus pets</h1>
                <p>Cadastre seus animais para agendar consultas e acompanhar o histórico clínico.</p>
            </div>
        </header>

        <div th:replace="~{fragments/layout :: alertas}"></div>

        <div class="grade-2">
            <section class="cartao">
                <h2>Pets cadastrados</h2>
                <p class="vazio" th:if="${pets.isEmpty()}">Você ainda não cadastrou nenhum pet.</p>
                <ul class="lista">
                    <li class="item" th:each="item : ${pets}">
                        <div>
                            <div class="item-titulo" th:text="${item.nome}">Nome</div>
                            <div class="item-detalhe"
                                 th:text="${item.especie} + ' · ' + ${item.raca} + ' · ' + ${item.sexo.descricao} + (${item.pesoKg} ? ' · ' + ${item.pesoKg} + ' kg' : '')">Detalhes</div>
                        </div>
                        <a class="botao botao-secundario botao-pequeno" th:href="@{/tutor/pets/{id}(id=${item.id})}">Prontuário</a>
                    </li>
                </ul>
            </section>

            <section class="cartao">
                <h2>Cadastrar novo pet</h2>
                <form class="formulario" th:action="@{/tutor/pets}" th:object="${pet}" method="post" novalidate>
                    <div th:replace="~{fragments/layout :: campo('nome', 'Nome', 'text')}"></div>
                    <div class="linha">
                        <div class="campo" th:classappend="${#fields.hasErrors('racaId')} ? 'invalido'">
                            <label for="racaId">Espécie e raça</label>
                            <select th:field="*{racaId}">
                                <option value="">Selecione</option>
                                <optgroup th:each="grupo : ${racasPorEspecie}" th:label="${grupo.key}">
                                    <option th:each="raca : ${grupo.value}" th:value="${raca.id}"
                                            th:text="${raca.nome} + ' (porte ' + ${raca.porte.toLowerCase()} + ')'">Raça</option>
                                </optgroup>
                            </select>
                            <span th:replace="~{fragments/layout :: erro('racaId')}"></span>
                        </div>
                        <div class="campo" th:classappend="${#fields.hasErrors('sexo')} ? 'invalido'">
                            <label for="sexo">Sexo</label>
                            <select th:field="*{sexo}">
                                <option value="">Selecione</option>
                                <option th:each="sexo : ${sexos}" th:value="${sexo}" th:text="${sexo.descricao}">Sexo</option>
                            </select>
                            <span th:replace="~{fragments/layout :: erro('sexo')}"></span>
                        </div>
                    </div>
                    <div class="linha">
                        <div th:replace="~{fragments/layout :: campo('dataNascimento', 'Data de nascimento', 'date')}"></div>
                        <div class="campo" th:classappend="${#fields.hasErrors('pesoKg')} ? 'invalido'">
                            <label for="pesoKg">Peso (kg)</label>
                            <input type="number" step="0.01" min="0.01" th:field="*{pesoKg}">
                            <span th:replace="~{fragments/layout :: erro('pesoKg')}"></span>
                        </div>
                    </div>
                    <div class="campo" th:classappend="${#fields.hasErrors('fotoUrl')} ? 'invalido'">
                        <label for="fotoUrl">Link da foto (opcional)</label>
                        <input type="url" th:field="*{fotoUrl}" placeholder="https://...">
                        <span th:replace="~{fragments/layout :: erro('fotoUrl')}"></span>
                    </div>
                    <button type="submit" class="botao">Cadastrar pet</button>
                </form>
            </section>
        </div>
    </main>
</div>
</body>
</html>
