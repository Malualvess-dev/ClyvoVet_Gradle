spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Estrutura e dados (comuns ao H2 e ao Oracle) + packages e trigger do grupo (só Oracle).
spring.flyway.locations=classpath:db/migration,classpath:db/oracle
# O usuário do Oracle da FIAP também guarda tabelas de outras disciplinas.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
