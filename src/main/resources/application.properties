spring.application.name=clyvovet
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
spring.messages.basename=messages

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

clyvovet.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
clyvovet.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
clyvovet.oauth2.github.client-id=${GITHUB_CLIENT_ID:}
clyvovet.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
